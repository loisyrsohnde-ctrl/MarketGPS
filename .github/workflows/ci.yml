name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write

jobs:
  # ============================================================================
  # Job 1: Lint - Python (ruff) + TypeScript (eslint)
  # ============================================================================
  lint:
    name: Lint (Python + TypeScript)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Python linting with ruff
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies (linting)
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter on Python code
        run: |
          ruff check backend/ pipeline/ core/ storage/ tests/ --fix --exit-zero
          ruff format backend/ pipeline/ core/ storage/ tests/ --line-length 100 --exit-zero
        continue-on-error: true

      # TypeScript linting with eslint
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install Node.js dependencies
        run: |
          if [ -f "ui/package.json" ]; then
            cd ui && npm install --prefer-offline --no-audit
          fi
        continue-on-error: true

      - name: Run ESLint on TypeScript code
        run: |
          if [ -f "ui/package.json" ]; then
            cd ui && npm run lint --if-present
          fi
        continue-on-error: true

  # ============================================================================
  # Job 2: Test Backend - Python tests with pytest + coverage
  # ============================================================================
  test-backend:
    name: Test Backend (Python)
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx
        continue-on-error: true

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=core \
            --cov=storage \
            --cov=pipeline \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -v \
            --tb=short
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  # ============================================================================
  # Job 3: Test Frontend - Next.js build check
  # ============================================================================
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install frontend dependencies
        run: |
          if [ -f "ui/package.json" ]; then
            cd ui && npm install --prefer-offline --no-audit
          fi
        continue-on-error: true

      - name: Check Next.js build
        run: |
          if [ -f "ui/package.json" ]; then
            cd ui && npm run build --if-present
          fi
        continue-on-error: true

      - name: Run frontend tests
        run: |
          if [ -f "ui/package.json" ]; then
            cd ui && npm test --if-present --passWithNoTests
          fi
        continue-on-error: true

  # ============================================================================
  # Job 4: Security Scan - Secret detection + dependency audit
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Secret detection with TruffleHog
      - name: Detect secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true

      # Python dependency audit
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies for security scan
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
        continue-on-error: true

      - name: Check Python dependencies with Safety
        run: |
          if [ -f "requirements.txt" ]; then
            safety check --file requirements.txt --json || true
          fi
        continue-on-error: true

      - name: Run Bandit security linter on Python code
        run: |
          bandit -r backend/ pipeline/ core/ storage/ --format json --output bandit-report.json || true
        continue-on-error: true

      # Node.js dependency audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Check npm dependencies
        run: |
          if [ -f "ui/package-lock.json" ]; then
            cd ui && npm audit --audit-level=moderate || true
          fi
        continue-on-error: true

      # Upload security reports
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 7

  # ============================================================================
  # Job 5: Summary - Aggregate results
  # ============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test-backend, test-frontend, security-scan]

    steps:
      - name: Check job statuses
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "❌ Lint job failed"
            exit 1
          fi

          if [ "${{ needs.test-backend.result }}" == "failure" ]; then
            echo "❌ Backend tests failed"
            exit 1
          fi

          if [ "${{ needs.test-frontend.result }}" == "failure" ]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi

          if [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "⚠️  Security scan found issues"
          fi

          echo "✅ All CI checks passed!"
        continue-on-error: true

      - name: Download artifacts
        uses: actions/download-artifact@v3
        if: always()
        with:
          path: artifacts

      - name: Print summary
        run: |
          echo "## CI Pipeline Summary"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Lint | ${{ needs.lint.result }} |"
          echo "| Backend Tests | ${{ needs.test-backend.result }} |"
          echo "| Frontend Tests | ${{ needs.test-frontend.result }} |"
          echo "| Security Scan | ${{ needs.security-scan.result }} |"
