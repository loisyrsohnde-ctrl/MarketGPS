[pytest]
# MarketGPS Test Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may be slower)
    slow: Slow running tests (deselect with '-m "not slow"')

# Paths
testpaths = tests
norecursedirs = .git venv backend frontend mobile docs .pytest_cache __pycache__

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Coverage (optional, requires pytest-cov)
# --cov=core --cov=storage --cov=pipeline --cov-report=html

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Doctest
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL
